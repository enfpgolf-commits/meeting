<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>회의록 비서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 좌측 = 5W1H 회의록 문서(제목·일시·장소·참석자 바로 입력), 우측 = 녹음 제어 · 작성 · 저장 목록 · 설정. 좁은 화면에서는 제어 패널이 위로 */
:root{
  --bg:#eceff4; --panel:#ffffff; --sunk:#f5f7fa; --ink:#1a2130; --muted:#5b6475; --line:#d6dbe4;
  --accent:#2b4cd0; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --rec:#cf3434; --rec-ink:#ffffff; --rec-soft:#fbe6e6; --ok:#1d8656; --ok-soft:#e0f3ea; --warn:#a8701a; --warn-soft:#f9efdc;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a; --panel:#191e27; --sunk:#141820; --ink:#e5e8ee; --muted:#98a1b1; --line:#2e3644;
  --accent:#7b95ff; --accent-ink:#0d1220; --accent-soft:#222a45;
  --rec:#ff6b6b; --rec-ink:#1a0b0b; --rec-soft:#3a1d20; --ok:#4cc38a; --ok-soft:#173327; --warn:#e2a64a; --warn-soft:#3a2c14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#191e27; --sunk:#141820; --ink:#e5e8ee; --muted:#98a1b1; --line:#2e3644;
  --accent:#7b95ff; --accent-ink:#0d1220; --accent-soft:#222a45;
  --rec:#ff6b6b; --rec-ink:#1a0b0b; --rec-soft:#3a1d20; --ok:#4cc38a; --ok-soft:#173327; --warn:#e2a64a; --warn-soft:#3a2c14;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;max-width:1440px;margin:0 auto 14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.top-r{display:flex;align-items:center;gap:10px}
.savestate{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savestate.busy i{background:var(--warn)}
.savestate.err i{background:var(--rec)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;max-width:1440px;margin:0 auto;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* ── 공통 버튼 ── */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.btn-sm{min-height:36px;padding:6px 11px;font-size:13.5px}
.btn-rec{background:var(--rec);border-color:var(--rec);color:var(--rec-ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-rec:hover:not(:disabled),.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-danger{color:var(--rec)}
.icon-btn{border:0;background:none;padding:8px;border-radius:6px;color:var(--muted);display:inline-flex;min-width:36px;min-height:36px;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

/* ── 좌측 문서 ── */
.doc{min-width:0}
.doc-head{padding:18px 22px 0;display:grid;gap:12px}
.doc-no{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font:600 11.5px var(--f-body);padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.b-ai{background:var(--accent-soft);color:var(--accent)}
.b-rule{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.b-none{background:var(--warn-soft);color:var(--warn)}
.in-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.in-label svg{width:12px;height:12px}
.title-in{width:100%;font-size:22px;font-weight:700;letter-spacing:-.015em;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 12px;min-width:0}
.title-in:hover,.meta-in input:hover{border-color:var(--muted)}
.meta-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.meta-in label{display:grid;gap:4px;min-width:0}
.meta-in label.wide{grid-column:1/-1}
.meta-in input{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:8px 10px;min-height:40px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.doc-tools{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:6px}

.doc-body{padding:18px 22px 22px;display:grid;gap:18px}
.doc-body > *{min-width:0}
.overview{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.sec-h{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.overview p{margin:0;max-width:72ch}
.edit-ta{width:100%;min-height:96px;resize:vertical;border:1px solid var(--accent);border-radius:6px;background:var(--panel);padding:8px 10px;line-height:1.55}

.w-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.w{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;display:grid;gap:8px;align-content:start;min-width:0;background:var(--panel);text-align:left}
button.w{cursor:pointer;font:inherit}
button.w:hover{border-color:var(--accent)}
.w-h{display:flex;align-items:baseline;gap:8px}
.w-k{font:600 12px var(--f-mono);color:var(--accent);letter-spacing:.08em}
.w-n{font-weight:700;font-size:16px}
.w-d{color:var(--muted);font-size:12.5px;margin-left:auto}
.w ul{margin:0;padding-left:18px;display:grid;gap:4px}
.w li{overflow-wrap:anywhere}
.w .empty{color:var(--muted);font-size:13.5px;margin:0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunk);letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td.num{font:500 12.5px var(--f-mono);color:var(--muted);width:40px}
td input{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--sunk)}

.dict{display:flex;gap:12px;align-items:flex-start;background:var(--rec-soft);border-radius:8px;padding:12px 14px}
.dict svg{width:26px;height:26px;flex:none;color:var(--rec)}
.dict b{display:block}
.dict span{font-size:13.5px;color:var(--muted)}
.transcript textarea{width:100%;min-height:440px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:12px 14px;font:15px/1.8 var(--f-body)}
.transcript textarea.live{border-color:var(--rec);box-shadow:0 0 0 1px var(--rec)}
.hint{color:var(--muted);font-size:13px;margin:0}

/* ── 사용 방법 ── */
.guide{padding:22px;display:grid;gap:18px}
.guide h2{margin:0;font-size:21px;text-wrap:balance}
.guide > p{margin:0;color:var(--muted);max-width:68ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;counter-increment:s}
.steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-mono);display:grid;place-items:center}
.steps b{font-size:15.5px}
.steps p{margin:0;font-size:14px;color:var(--muted);max-width:70ch}
.steps p strong{color:var(--ink);font-weight:600}
.kbd{font:600 12px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sunk);color:var(--ink)}
.tipbox{background:var(--warn-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.tipbox b{color:var(--warn)}
.tipbox ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}

/* ── 우측 ── */
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.card{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.on{background:var(--rec-soft);color:var(--rec)}
.status.on i{animation:blink 1.1s infinite}
.status.pause{background:var(--warn-soft);color:var(--warn)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.on i{animation:none}}
.clock{font:600 34px/1 var(--f-mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.micbox{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.mic{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:2px solid var(--line);color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.mic svg{width:36px;height:36px}
.mic.on{background:var(--rec);border-color:var(--rec);color:var(--rec-ink);animation:pulse 1.4s ease-out infinite}
.mic.wait{border-color:var(--rec);color:var(--rec)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}100%{box-shadow:0 0 0 20px color-mix(in srgb,var(--rec) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.mic-state{font-weight:700;font-size:16px}
.mic-state.on{color:var(--rec)}
.setup{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.setup b{color:var(--warn);display:block;margin-bottom:4px}
.setup ol{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.field input{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--sunk);padding:8px 10px;min-height:40px}
.ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live{margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;min-height:60px;max-height:150px;overflow:auto}
.live .l{color:var(--muted);overflow-wrap:anywhere}
.live .l b{font:500 11.5px var(--f-mono);margin-right:6px}
.live .interim{color:var(--accent)}
.sub{margin:8px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.wide-btn{width:100%;min-height:50px;font-size:15.5px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.files-tools{display:flex;gap:6px;flex-wrap:wrap}
.mtg{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mtg + .mtg{margin-top:8px}
.mtg.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mtg-h{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 12px;background:var(--sunk)}
.mtg-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0}
.mtg-open b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtg-open small{color:var(--muted);font:500 11.5px var(--f-mono)}
.files{list-style:none;margin:0;padding:4px 0}
.files li{display:flex;align-items:center;gap:4px;padding:0 6px 0 12px}
.file{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 0;text-align:left;font-size:13px}
.file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover span:last-child{text-decoration:underline}
.ext{font:600 10px var(--f-mono);padding:2px 5px;border-radius:4px;flex:none;letter-spacing:.03em}
.ext-txt{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.ext-md{background:var(--accent-soft);color:var(--accent)}
.na{font-size:12.5px;color:var(--muted)}
.confirm{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--rec-soft);font-size:13.5px;flex-wrap:wrap}
.confirm span{flex:1;min-width:140px}
.list-empty{color:var(--muted);font-size:13.5px;margin:0}
.fields{display:grid;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--sunk);padding:8px 10px;min-height:40px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px}

.loading{padding:60px 24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:8px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:20}
@media (max-width:520px){.doc-head,.doc-body,.guide{padding-left:16px;padding-right:16px}.clock{font-size:32px}.title-in{font-size:19px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><h1>회의록 비서</h1><span>녹음 → 텍스트 변환 → 5W1H 정리</span></div>
  <div class="top-r">
    <span class="savestate" id="saveState"><i></i><span>불러오는 중…</span></span>
    <button class="btn btn-sm btn-soft" id="bHelp"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.3"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4"/><circle cx="8" cy="11.6" r=".5" fill="currentColor"/></svg>사용 방법</button>
  </div>
</header>

<main class="app">
  <section class="doc panel" id="doc" aria-label="회의록"><div class="loading">저장된 회의록을 불러오는 중…</div></section>

  <aside class="side">
    <section class="panel card" aria-label="녹음">
      <div class="card-h"><h2>녹음</h2><span class="status" id="status"><i></i><span>대기</span></span></div>
      <div class="micbox">
        <div class="mic" id="mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></div>
        <div><div class="mic-state" id="micState">마이크 OFF</div><div class="clock" id="clock">00:00:00</div></div>
      </div>
      <div class="ctrls">
        <button class="btn btn-rec" id="bStart"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg><span>녹음 시작</span></button>
        <button class="btn" id="bPause" disabled><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg><span>일시정지</span></button>
        <button class="btn" id="bStop" disabled><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="currentColor"/></svg><span>정지</span></button>
      </div>
      <div class="live" id="live" aria-live="polite"></div>
      <div class="setup" id="setupBox" hidden></div>
    </section>

    <section class="panel card">
      <button class="btn btn-primary wide-btn" id="bWrite"><svg viewBox="0 0 16 16"><path d="M3 2h7l3 3v9H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8h5M5.5 11h5" stroke="currentColor" stroke-width="1.6"/></svg><span>회의록 작성 (5W1H)</span></button>
      <p class="sub" id="writeSub"></p>
    </section>

    <section class="panel card" aria-label="저장된 회의록">
      <div class="card-h"><h2>저장된 회의록</h2>
        <div class="files-tools">
          <button class="btn btn-sm" id="bNew">+ 새 회의</button>
          <button class="btn btn-sm" id="bImport">텍스트 불러오기</button>
          <input type="file" id="fileIn" accept=".txt,.md,text/plain" hidden>
        </div>
      </div>
      <div id="list"><p class="list-empty">불러오는 중…</p></div>
    </section>

    <section class="panel card" aria-label="설정">
      <div class="card-h"><h2>설정</h2></div>
      <div class="fields">
        <label class="check"><input type="checkbox" id="fAuto" checked> 정지하면 회의록 자동 작성</label>
        <div class="field" id="langField"><label for="fLang">음성 인식 언어</label>
          <select id="fLang"><option value="ko-KR">한국어</option><option value="en-US">English (US)</option><option value="ja-JP">日本語</option><option value="zh-CN">中文</option></select></div>
        <div class="field"><label for="fKey">Claude API 키 (선택 — 넣으면 AI가 더 자연스럽게 정리, 사용료 별도)</label><input id="fKey" type="password" autocomplete="off" placeholder="비워 두면 자동 분류로 정리"></div>
        <p class="hint" id="modeHint"></p>
      </div>
    </section>
  </aside>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmtClock = ms => { const s = Math.floor(ms/1000); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; };
const fmtStamp = ms => { const s = Math.floor(ms/1000); return s >= 3600 ? fmtClock(ms) : `${pad(Math.floor(s/60))}:${pad(s%60)}`; };
const DOW = ["일","월","화","수","목","금","토"];
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtDate(v, withTime = true){

const timers = {}, inflight = new Set(), dirty = new Set();

  m.updatedAt = Date.now(); clearTimeout(timers[m.id]); setSave("busy", "저장 중…");
  timers[m.id] = setTimeout(() => flush(m.id), now ? 0 : 900);
}
async function flush(id){
  if (inflight.has(id)) { dirty.add(id); return; }
  const m = meetings.find(x => x.id === id); if (!m) return;
  inflight.add(id);
  try { await Store.put(JSON.parse(JSON.stringify(m))); setSave("", savedLabel()); }
  catch (e) { setSave("err", "저장 실패"); toast(e?.code === "quota_exceeded" ? "저장 공간이 가득 찼습니다. 오래된 회의록을 삭제해 주세요." : "저장하지 못했습니다. 잠시 후 다시 시도됩니다."); dirty.add(id); setTimeout(() => dirty.has(id) && !inflight.has(id) && (dirty.delete(id), flush(id)), 5000); }
  finally { inflight.delete(id); if (dirty.delete(id)) flush(id); }
}

/* ───────── 5W1H 규칙 기반 정리 (Claude 사용 불가 시) ───────── */
const RX = {
  date: /(\d{4}년\s*)?\d{1,2}월\s*\d{1,2}일|(다음|이번|다다음)\s*주(\s*[월화수목금토일]요일)?|[월화수목금토일]요일|내일|모레|월말|월초|연말|분기\s*내|(오전|오후)\s*\d{1,2}시(\s*\d{1,2}분)?|\d{1,2}시(\s*\d{1,2}분)?|\d+\s*(일|주|개월)\s*(안에|이내|후|뒤)/,
  person: /([가-힣]{1,4})\s?(부장|차장|과장|대리|사원|주임|팀장|실장|책임|선임|수석|연구원|이사|상무|전무|대표|매니저)(님)?/g,
  place: /(회의실|본사|공장|생산\s*라인|현장|연구소|사무실|실험실|시험실|무향실|고객사|협력사|온라인|화상\s*회의|줌|팀즈|센터|매장|창고)/,
  what: /(결정|결론|합의|확정|안건|논의|검토|하기로|정했|채택|승인|보류)/,
  why: /(때문|위해|위한|이유|목적|원인|문제|배경|불만|클레임|요구|필요)/,
  how: /(방법|방식|통해|으로\s*(진행|변경|대체|교체)|계획|절차|단계|테스트|시험|적용|변경|개선|교체|추가|설계)/,
  action: /(까지|해\s*주세요|해주시|부탁|담당|맡아|진행하겠|하겠습니다|할게요|준비해|공유해|보고해)/
};
const NOT_NAME = new Set(["우리","저희","그","이","저","다른","각","모든","해당","담당","전","현","신임","새"]);
const sentencesOf = t => t.split(/\n+/).map(l => l.replace(/^\s*\[[\d:]+\]\s*/, "").trim()).filter(Boolean)
  .flatMap(l => l.split(/(?<=[.!?。])\s+/)).map(s => s.trim()).filter(s => s.length > 1);
function peopleIn(s){ const out = []; let m; RX.person.lastIndex = 0; while ((m = RX.person.exec(s))) if (!NOT_NAME.has(m[1])) out.push(`${m[1]} ${m[2]}`); return out; }
const uniq = a => [...new Set(a.map(x => String(x).trim()).filter(Boolean))];
function ruleSummarize(m){
  const S = sentencesOf(m.transcript), pick = re => S.filter(s => re.test(s));
  const people = uniq(S.flatMap(peopleIn)), attendees = uniq((m.attendees || "").split(/[,，、]/));
  const who = []; if (attendees.length) who.push(`참석자: ${attendees.join(", ")}`); if (people.length) who.push(`발언 중 언급: ${people.join(", ")}`);
  pick(/담당|맡아|맡기로/).forEach(s => who.push(s));
  const when = [`회의 일시: ${fmtDate(m.datetime)}${m.duration ? ` · 녹음 ${durText(m.duration)}` : ""}`]; pick(RX.date).forEach(s => when.push(s));
  const where = []; if (m.location) where.push(`회의 장소: ${m.location}`); pick(RX.place).forEach(s => where.push(s));
  const what = pick(RX.what), why = pick(RX.why);
  const actionS = pick(RX.action).filter(s => !/^다음\s*회의/.test(s) && (peopleIn(s).length || RX.date.test(s) || /제가|저희가/.test(s)));
  const actions = actionS.map(s => { const p = peopleIn(s), d = s.match(RX.date);
    const task = s.replace(/^[가-힣]{1,4}\s?(부장|차장|과장|대리|사원|주임|팀장|실장|책임|선임|수석|연구원|이사|상무|전무|대표|매니저)(님)?(은|는|이|가|께서)?\s*/, "");
    return { who: p[0] || (/제가|저희가/.test(s) ? "발언자" : "미정"), what: task, due: d ? d[0] : "미정" }; });
  const how = pick(RX.how).filter(s => !actionS.includes(s));
  const cap = (a, n = 6) => uniq(a).slice(0, n), lead = cap(what, 2);
  const overview = `‘${m.title}’ 회의에서 논의·결정 사항 ${uniq(what).length}건, 실행 항목 ${actions.length}건이 정리되었습니다.` + (lead.length ? " 주요 내용: " + lead.join(" / ") : "");
  return { overview, who: cap(who), when: cap(when), where: cap(where), what: cap(what), why: cap(why), how: cap(how), actions: actions.slice(0, 10) };
}

/* ───────── Claude로 정리 ───────── */
async function claudeSummarize(m){
  const c = CL(); if (!c) return null;
  const sample = await c.use("sample"); if (!sample) return null;
  const prompt = `너는 한국 회사의 회의록 작성 담당자다. 아래 회의 녹음 받아쓰기 원본을 5W1H 원칙에 맞게 정리해라.
받아쓰기라서 오타·띄어쓰기 오류가 있을 수 있으니 문맥에 맞게 바로잡되, 원본에 없는 사실은 지어내지 말고 모르면 "미정"이라고 써라.
각 배열 항목은 개조식 한 문장(~함, ~임, ~예정 등)으로 짧게 써라.

회의 제목: ${m.title}
일시: ${fmtDate(m.datetime)}
장소: ${m.location || "미기재"}
참석자: ${m.attendees || "미기재"}

[원본]
${m.transcript}

다음 JSON 하나만 답하라:
{"overview":"3문장 이내 요약","who":["누가: 참석자·담당자"],"when":["언제: 회의 일시·기한·다음 일정"],"where":["어디서: 장소"],"what":["무엇을: 안건·결정 사항"],"why":["왜: 배경·목적·원인"],"how":["어떻게: 실행 방법·계획"],"actions":[{"who":"담당자","what":"할 일","due":"기한"}]}`;
  const js = await sample.json(prompt, { modelTier: "default", cache: false });
  const arr = a => Array.isArray(a) ? a.map(String) : [];
  return { overview: String(js?.overview || ""), who: arr(js?.who), when: arr(js?.when), where: arr(js?.where), what: arr(js?.what), why: arr(js?.why), how: arr(js?.how),
    actions: Array.isArray(js?.actions) ? js.actions.map(a => ({ who: String(a?.who || "미정"), what: String(a?.what || ""), due: String(a?.due || "미정") })) : [] };
}
async function apiSummarize(m){
  if (!settings.key) return null;
  const prompt = `아래 회의 녹음 변환 원본을 5W1H 원칙에 맞게 한국어 회의록으로 정리하라. 음성 변환 오타는 문맥에 맞게 바로잡되 원본에 없는 사실은 지어내지 말고 모르면 "미정"으로 써라. 각 항목은 개조식 한 문장.\n회의 제목: ${m.title}\n일시: ${fmtDate(m.datetime)}\n장소: ${m.location || "미기재"}\n참석자: ${m.attendees || "미기재"}\n\n[원본]\n${m.transcript}\n\nJSON 하나만 답하라: {"overview":"3문장 이내 요약","who":[],"when":[],"where":[],"what":[],"why":[],"how":[],"actions":[{"who":"","what":"","due":""}]}`;
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST",
    headers: { "content-type": "application/json", "x-api-key": settings.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: "claude-sonnet-5-5", max_tokens: 3000, messages: [{ role: "user", content: prompt }] }) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json(); const text = (j.content || []).map(c => c.text || "").join("");
  const js = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
  const arr = a => Array.isArray(a) ? a.map(String) : [];
  return { overview: String(js.overview || ""), who: arr(js.who), when: arr(js.when), where: arr(js.where), what: arr(js.what), why: arr(js.why), how: arr(js.how),
    actions: Array.isArray(js.actions) ? js.actions.map(a => ({ who: String(a.who || "미정"), what: String(a.what || ""), due: String(a.due || "미정") })) : [] };
}
async function writeMinutes(){
  const m = cur(); if (!m || busy) return;
  if (!m.transcript.replace(/\[[\d:]+\]/g, "").trim()) { toast("원본 텍스트가 비어 있습니다. 먼저 녹음(받아쓰기)하거나 원본 텍스트 칸에 내용을 넣어 주세요.", 5000); view = "transcript"; renderDoc(); return; }
  busy = true; renderWriteBtn();
  try {
    let s = null;
    try { s = settings.key ? await apiSummarize(m) : await claudeSummarize(m); if (s) m.method = "ai"; }
    catch (e) { toast("AI 정리에 실패해 자동 분류로 정리했습니다. API 키를 확인해 주세요.", 5000); }
    if (!s) { s = ruleSummarize(m); m.method = "rule"; }
    m.summary = s; save(m, true);

}

/* ───────── 파일 내보내기 ───────── */
const fileNames = m => { const b = `${ymd(m.datetime)}_${safeName(m.title)}`; return { txt: `원본_${b}.txt`, md: `회의록_${b}_5W1H.md` }; };
function toMarkdown(m){
  const s = m.summary || ruleSummarize(m);
  const sec = (k, n, d, a) => `## ${k} · ${n} (${d})\n${a.length ? a.map(x => `- ${x}`).join("\n") : "- 미정"}\n`;
  return `# ${m.title}\n\n| 항목 | 내용 |\n|---|---|\n| 문서번호 | ${docNo(m)} |\n| 일시 | ${fmtDate(m.datetime)} |\n| 장소 | ${m.location || "—"} |\n| 참석자 | ${m.attendees || "—"} |\n\n## 개요\n${s.overview}\n\n`
    + sec("WHO","누가","참석자·담당자",s.who) + "\n" + sec("WHEN","언제","일시·기한",s.when) + "\n" + sec("WHERE","어디서","장소",s.where) + "\n"
    + sec("WHAT","무엇을","안건·결정",s.what) + "\n" + sec("WHY","왜","배경·목적",s.why) + "\n" + sec("HOW","어떻게","방법·계획",s.how)
    + `\n## 실행 항목\n| # | 담당 | 할 일 | 기한 |\n|---|---|---|---|\n`
    + (s.actions.length ? s.actions.map((a, i) => `| ${i+1} | ${a.who} | ${String(a.what).replace(/\|/g, "/")} | ${a.due} |`).join("\n") : "| - | - | 없음 | - |") + "\n";
}
const toTxt = m => `${m.title}\n일시: ${fmtDate(m.datetime)}\n장소: ${m.location || "—"}\n참석자: ${m.attendees || "—"}\n${"-".repeat(40)}\n${m.transcript}\n`;
async function saveFile(name, text, type){
  const blob = new Blob(["﻿" + text], { type: type + ";charset=utf-8" });
  const c = CL();
  if (c) {
    const dl = await c.use("downloads").catch(() => null);
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); toast(`‘${name}’ 파일을 저장했습니다.`); }
      catch (e) {
        if (e?.code === "declined") return;
        if (e?.code === "rejected_extension" && !name.endsWith(".txt")) return saveFile(name.replace(/\.[^.]+$/, ".txt"), text, "text/plain");
        toast("파일을 저장하지 못했습니다. " + (e?.message || ""));
      }
      return;
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function downloadFile(m, kind){
  const n = fileNames(m);
  if (kind === "txt") return saveFile(n.txt, toTxt(m), "text/plain");
  if (!m.summary) { toast("아직 회의록을 작성하지 않았습니다. ‘회의록 작성’을 먼저 눌러 주세요."); return; }
  return saveFile(n.md, toMarkdown(m), "text/markdown");
}

/* ───────── 녹음 ─────────
   마이크 ON/OFF: ‘녹음 시작’·‘재개’ = 마이크 켜고 음성→글자 자동 변환, ‘일시정지’·‘정지’ = 마이크 끔.
   Safari(iPad)·Chrome·Edge에서 https 주소로 열었을 때 동작. 음성 인식을 못 쓰는 환경에서는 키보드 받아쓰기로 대체. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const DIRECT_MIC = !!SR && window.isSecureContext !== false;
let rState = "idle", rMode = "auto";
let rec = null, interim = "", micOn = false, srFatal = false;
let elapsed = 0, startedAt = 0, clockT = null;
const now = () => performance.now();
const segTime = () => elapsed + (rState === "recording" ? now() - startedAt : 0);

function ta(){ return $("#taTranscript"); }
let syncT = null;
function syncTA(){
  const t = ta(); if (!t) return;
  const m = meetings.find(x => x.id === t.dataset.id); if (!m) return;
  if (t.value !== m.transcript) { m.transcript = t.value; save(m); }
}
function appendStamp(){
  const m = cur(), t = ta(); if (!m || !t) return;
  const v = t.value.replace(/\s+$/, "").replace(/\n?\[[\d:]+\]$/, "");
  t.value = (v ? v + "\n" : "") + `[${fmtStamp(segTime())}] `;
  m.transcript = t.value; save(m);
  t.focus(); t.setSelectionRange(t.value.length, t.value.length); t.scrollTop = t.scrollHeight;
}
function startRecording(){
  if (rState === "paused") return resumeRecording();
  if (rState !== "idle" || !loaded) return;
  let m = cur();
  if (!m || m.summary) { m = newMeeting(); meetings.push(m); currentId = m.id; save(m, true); }
  elapsed = 0; startedAt = now(); rState = "recording"; srFatal = false;
  rMode = DIRECT_MIC ? "auto" : "dictation";
  clockT = setInterval(renderClock, 250);
  clearInterval(syncT); syncT = setInterval(() => { if (rState === "recording" && rMode === "dictation") { syncTA(); renderLive(); } }, 1500);

/* 음성 인식: iPad Safari는 같은 문장을 누적해서 여러 번 보내는 경우가 있어 중복을 걸러냄 */
let committed = 0;
function startSR(){
  if (rec) return;
  const r = new SR(); rec = r; committed = 0; interim = "";
  r.lang = settings.lang; r.continuous = true; r.interimResults = true;
  r.onstart = () => { if (rec === r) { micOn = true; renderRec(); } };
  r.onresult = e => {
    if (rec !== r) return;
    const list = [];
    for (let i = 0; i < e.results.length; i++) {
      const res = e.results[i], txt = (res[0]?.transcript || "").trim(); if (!txt) continue;
      const last = list[list.length - 1];
      if (last && !last.final && txt.startsWith(last.text)) { last.text = txt; last.final = res.isFinal; }
      else list.push({ text: txt, final: res.isFinal });
    }
    while (committed < list.length && list[committed].final) { addLine(list[committed].text); committed++; }
    interim = list.slice(committed).map(x => x.text).join(" ");
    renderLive();
  };
  r.onerror = e => {
    if (rec !== r) return;
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
      srFatal = true; showSetup(e.error);
      if (rState === "recording") pauseRecording();
    } else if (e.error === "network") toast("음성 변환 서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.", 5000);
  };
  r.onend = () => {
    if (rec !== r) return;
    commitInterim(); rec = null; micOn = false;
    if (rState === "recording" && !srFatal) setTimeout(() => { if (rState === "recording" && !rec) startSR(); }, 300);   // 말이 끊기면 자동으로 다시 켬
    renderRec();
  };

}
function commitInterim(){ const t = interim.trim(); interim = ""; if (t) addLine(t); }
function stopSR(){ const r = rec; rec = null; micOn = false; commitInterim(); try { r?.stop(); } catch {} renderRec(); }
function addLine(text){
  const m = cur(); if (!m || !text) return;
  m.transcript = (m.transcript ? m.transcript + "\n" : "") + `[${fmtStamp(segTime())}] ${text}`; save(m);
  const t = ta(); if (t) { t.value = m.transcript; t.scrollTop = t.scrollHeight; }
  renderLive();
}

  else if (rMode === "dictation") tip = "키보드의 마이크 버튼을 눌러 말하는 중… (최근 기록)";
  else tip = micOn ? "듣는 중… 말한 내용이 아래에 글자로 나타납니다." : "마이크를 켜는 중…";
  live.innerHTML = `<div class="l" style="margin-bottom:4px">${esc(tip)}</div>` + lines.map(l => { const mm = l.match(/^\[([\d:]+)\]\s*(.*)$/); return `<div class="l" style="color:var(--ink)">${mm ? `<b>${esc(mm[1])}</b>${esc(mm[2])}` : esc(l)}</div>`; }).join("")
    + (interim ? `<div class="interim">${esc(interim)}…</div>` : "");
  live.scrollTop = live.scrollHeight;
}
function renderWriteBtn(){
  const b = $("#bWrite");
  b.disabled = busy || !cur() || rState !== "idle";
  b.innerHTML = busy ? `<i class="spin"></i><span>정리하는 중…</span>` : `<svg viewBox="0 0 16 16"><path d="M3 2h7l3 3v9H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8h5M5.5 11h5" stroke="currentColor" stroke-width="1.6"/></svg><span>회의록 작성 (5W1H)</span>`;
  $("#writeSub").textContent = rState !== "idle" ? "녹음을 ‘정지’하면 누를 수 있습니다."
    : !cur() ? "먼저 회의를 만들거나 녹음을 시작하세요."
    : settings.key ? "Claude AI가 원본을 읽고 5W1H로 정리합니다." : "원본 문장을 5W1H 항목으로 자동 분류합니다.";
}
function renderList(){
  const el = $("#list");
  if (!loaded) return;
  if (!meetings.length) { el.innerHTML = `<p class="list-empty">저장된 회의록이 없습니다. ‘녹음 시작’ 또는 ‘+ 새 회의’를 누르면 여기에 생깁니다.</p>`; return; }
  el.innerHTML = sorted().map(m => {
    const n = fileNames(m);
    const conf = pendingDelete === m.id ? `<div class="confirm"><span>‘${esc(m.title)}’의 원본과 회의록을 모두 지울까요? 되살릴 수 없습니다.</span><button class="btn btn-sm btn-danger" data-del-yes="${m.id}">삭제</button><button class="btn btn-sm" data-del-no="1">취소</button></div>` : "";
    return `<div class="mtg${m.id === currentId && view !== "guide" ? " active" : ""}">
      <div class="mtg-h">
        <button class="mtg-open" data-open="${m.id}"><b>${esc(m.title || "제목 없음")}</b><small>${esc(fmtDate(m.datetime))}${m.duration ? " · " + durText(m.duration) : ""}</small></button>
        <button class="icon-btn" data-del="${m.id}" aria-label="${esc(m.title)} 삭제" title="삭제">${ICON.trash}</button>
      </div>${conf}
      <ul class="files">
        <li><button class="file" data-file="${m.id}" data-kind="transcript"><span class="ext ext-txt">원본</span><span>${esc(n.txt)}</span></button>
          <button class="icon-btn" data-dlf="${m.id}" data-kind="txt" aria-label="원본 파일 저장" title="파일로 저장">${ICON.dl}</button></li>
        ${m.summary ? `<li><button class="file" data-file="${m.id}" data-kind="minutes"><span class="ext ext-md">회의록</span><span>${esc(n.md)}</span></button>
          <button class="icon-btn" data-dlf="${m.id}" data-kind="md" aria-label="회의록 파일 저장" title="파일로 저장">${ICON.dl}</button></li>`
          : `<li><span class="file na"><span class="ext ext-md">회의록</span>아직 작성 전</span></li>`}
      </ul></div>`;
  }).join("");
}
function renderSettings(){
  $("#fAuto").checked = settings.auto; $("#fLang").value = settings.lang; $("#fKey").value = settings.key;
  $("#langField").hidden = !DIRECT_MIC;
  $("#modeHint").textContent = DIRECT_MIC ? "회의록은 이 기기의 브라우저에 저장됩니다. 중요한 회의록은 ‘파일로 저장’으로 백업해 두세요." : "";
  if (!DIRECT_MIC) showSetup("unsupported");
}
function renderAll(){ renderDoc(); renderRec(); renderLive(); renderWriteBtn(); renderList(); }

/* ───────── 이벤트 ───────── */
$("#bStart").onclick = startRecording;
$("#bPause").onclick = pauseRecording;
$("#bStop").onclick = stopRecording;
const flushAll = () => { syncTA(); for (const id of Object.keys(timers)) { clearTimeout(timers[id]); delete timers[id]; flush(id); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });
window.addEventListener("pagehide", flushAll);
$("#bWrite").onclick = writeMinutes;
$("#bHelp").onclick = () => { view = "guide"; editing = false; renderDoc(); renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#bNew").onclick = () => {
  if (rState !== "idle") { toast("녹음 중에는 새 회의를 만들 수 없습니다. 먼저 ‘정지’를 눌러 주세요."); return; }
  const m = newMeeting(); meetings.push(m); currentId = m.id; view = "transcript"; editing = false; save(m, true); renderAll();
  const t = $("#inTitle"); t.focus(); t.select(); toast("새 회의를 만들었습니다. 제목을 입력하세요.");
};
$("#bImport").onclick = () => { if (rState !== "idle") { toast("녹음 중에는 불러올 수 없습니다."); return; } $("#fileIn").click(); };
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const text = (await f.text()).replace(/^﻿/, "").trim();
  const m = newMeeting({ title: f.name.replace(/\.[^.]+$/, ""), transcript: text });
  meetings.push(m); currentId = m.id; view = "transcript"; editing = false; save(m, true); renderAll();
  toast(`‘${f.name}’을(를) 원본으로 불러왔습니다. ‘회의록 작성’을 누르면 정리합니다.`, 5000);
};
$("#fAuto").onchange = e => { settings.auto = e.target.checked; LS.set("mm.settings", settings); };
$("#fKey").oninput = e => { settings.key = e.target.value.trim(); LS.set("mm.settings", settings); renderWriteBtn(); };
$("#fLang").onchange = e => { settings.lang = e.target.value; LS.set("mm.settings", settings); };

const doc = $("#doc");
doc.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const m = cur();
  if (t.dataset.view) { view = t.dataset.view; editing = false; renderDoc(); renderList(); }
  else if (t.dataset.act === "start") startRecording();
  else if (t.dataset.act === "write") writeMinutes();
  else if (t.id === "bEdit") { editing = !editing; if (!editing && m) { save(m, true); toast("수정한 내용을 저장했습니다."); } renderDoc(); }
  else if (t.dataset.editk) { editing = true; renderDoc(); const x = doc.querySelector(`textarea[data-k="${t.dataset.editk}"]`); x?.focus(); }
  else if (t.dataset.dl && m) downloadFile(m, t.dataset.dl);
  else if (t.id === "bAddAct" && m) { m.summary.actions.push({ who: "미정", what: "", due: "미정" }); save(m); renderDoc(); }
  else if (t.dataset.arm != null && m) { m.summary.actions.splice(+t.dataset.arm, 1); save(m); renderDoc(); }
});
doc.addEventListener("input", e => {
  const m = cur(); if (!m) return; const t = e.target;
  const map = { inTitle: "title", inDate: "datetime", inPlace: "location", inWho: "attendees" };
  if (map[t.id]) { m[map[t.id]] = t.value; save(m); renderList(); }
  else if (t.id === "taTranscript") { m.transcript = t.value; save(m); renderLive(); }
  else if (t.dataset.k === "overview") { m.summary.overview = t.value; save(m); }
  else if (t.dataset.k) { m.summary[t.dataset.k] = t.value.split("\n").map(s => s.replace(/^[-•·]\s*/, "").trim()).filter(Boolean); save(m); }
  else if (t.dataset.a != null) { m.summary.actions[+t.dataset.a][t.dataset.f] = t.value; save(m); }
});
doc.addEventListener("keydown", e => {
  if (e.target.id === "taTranscript" && e.key === "Enter" && !e.isComposing && rState === "recording" && rMode === "dictation") {
    e.preventDefault(); appendStamp();
  }
});

$("#list").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const id = t.dataset.open || t.dataset.file;
  if (id) {
    if (rState !== "idle" && id !== currentId) { toast("녹음 중에는 다른 회의를 열 수 없습니다. 먼저 ‘정지’를 눌러 주세요."); return; }
    const m = meetings.find(x => x.id === id);
    currentId = id; view = t.dataset.kind || (m?.summary ? "minutes" : "transcript"); editing = false; pendingDelete = null; renderAll();
    if (window.matchMedia("(max-width:900px)").matches) doc.scrollIntoView({ behavior: "smooth" });
  } else if (t.dataset.dlf) {
    const m = meetings.find(x => x.id === t.dataset.dlf); if (m) downloadFile(m, t.dataset.kind);
  } else if (t.dataset.del) {
    if (rState !== "idle" && t.dataset.del === currentId) { toast("녹음 중인 회의는 지울 수 없습니다."); return; }
    pendingDelete = t.dataset.del; renderList();
  } else if (t.dataset.delYes) {
    const did = t.dataset.delYes; clearTimeout(timers[did]);
    meetings = meetings.filter(m => m.id !== did); pendingDelete = null;
    try { await Store.del(did); toast("삭제했습니다."); } catch { toast("삭제하지 못했습니다. 다시 시도해 주세요."); }
    if (currentId === did) { currentId = sorted()[0]?.id || null; if (!currentId) view = "guide"; else if (view === "guide") view = "minutes"; }
    renderAll();
  } else if (t.dataset.delNo) { pendingDelete = null; renderList(); }
});

/* ───────── 시작 ───────── */
(async function init(){
  renderRec(); renderLive(); renderWriteBtn(); renderSettings();
  await Store.init();
  try { meetings = await Store.all(); }
  catch (e) { meetings = []; toast("저장된 회의록을 불러오지 못했습니다. 페이지를 다시 열어 주세요.", 6000); }
  loaded = true;
  const first = sorted()[0];
  if (first) { currentId = first.id; view = first.summary ? "minutes" : "transcript"; }
  setSave("", savedLabel());
  renderAll();
})();
</script>
</body>
</html>
